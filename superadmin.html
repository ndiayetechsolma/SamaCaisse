<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>SamaCaisse · Espace plateforme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16241f;
    --muted: #6b7a74;
    --line: rgba(22, 36, 31, .12);
    --teal: #124238;
    --teal-dark: #0b2a24;
    --lime: #cdeadf;
    --lime-soft: #e8f5f0;
    --neutral-soft: #e8ebe9;
    --red: #a34a42;
    --red-dark: #7a352f;
    --red-soft: #f3ddd9;
    --shadow: 0 20px 60px rgba(22, 36, 31, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: linear-gradient(180deg, #f4f8f4, #e8f0ea);
    font-family: 'DM Sans', Arial, sans-serif;
  }
  .hidden { display: none !important; }
  button, input { font: inherit; }
  button { cursor: pointer; }

  .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card {
    width: min(380px, 100%); padding: 32px; border-radius: 18px;
    background: rgba(255,255,255,.85); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .login-card h1 { margin: 0 0 6px; font: 800 22px Manrope, sans-serif; letter-spacing: -.8px; }
  .login-card p { margin: 0 0 22px; color: var(--muted); font-size: 12px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--muted); }
  .field input {
    height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px;
    outline-color: var(--teal); background: white; color: var(--ink); font-size: 13px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 42px; border: 0; border-radius: 999px;
    color: white; background: var(--teal); font-size: 12px; font-weight: 700;
    transition: .2s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .6; transform: none; cursor: default; }
  .btn-danger { background: var(--red); }
  .error-text { min-height: 15px; margin: 4px 0 10px; color: var(--red); font-size: 11px; }

  .dashboard { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
  .dash-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
  .dash-header h1 { margin: 0; font: 800 24px Manrope, sans-serif; letter-spacing: -1px; }
  .dash-header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .logout-btn { border: 1px solid var(--line); background: white; color: var(--muted); border-radius: 999px; padding: 9px 16px; font-size: 11px; font-weight: 700; }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
  .stat-box { padding: 16px 18px; border-radius: 14px; background: white; border: 1px solid var(--line); }
  .stat-box span { display: block; color: var(--muted); font-size: 11px; }
  .stat-box strong { display: block; margin-top: 6px; font: 800 22px Manrope, sans-serif; }

  .compte-card { margin-bottom: 14px; padding: 18px 20px; border-radius: 16px; background: white; border: 1px solid var(--line); }
  .compte-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .compte-top strong { display: block; font: 700 15px Manrope, sans-serif; }
  .compte-top span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
  .compte-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--neutral-soft); color: var(--ink);
    border-radius: 8px; padding: 7px 12px; font-size: 10px; font-weight: 700;
  }
  .icon-btn.danger { background: var(--red-soft); color: var(--red-dark); border-color: rgba(163,74,66,.3); }

  .entreprise-list { margin-top: 14px; display: grid; gap: 8px; }
  .entreprise-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px; background: var(--lime-soft); flex-wrap: wrap;
  }
  .entreprise-row .info strong { font-size: 12px; }
  .entreprise-row .info span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }

  @media (max-width: 640px) {
    .stats-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <h1>Espace plateforme</h1>
      <p>Accès réservé — connexion super-admin.</p>
      <div class="field">
        <label for="sa-email">Email</label>
        <input id="sa-email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="sa-password">Mot de passe</label>
        <input id="sa-password" type="password" autocomplete="current-password" required />
      </div>
      <div id="login-error" class="error-text"></div>
      <button type="submit" id="login-button" class="btn">Se connecter</button>
    </form>
  </div>

  <div id="dashboard-screen" class="dashboard hidden">
    <div class="dash-header">
      <div>
        <h1>Vue plateforme</h1>
        <p>Tous les comptes, entreprises et boutiques créés sur SamaCaisse.</p>
      </div>
      <button id="logout-button" class="logout-btn">Se déconnecter</button>
    </div>

    <div class="stats-row">
      <div class="stat-box"><span>Comptes</span><strong id="stat-comptes">—</strong></div>
      <div class="stat-box"><span>Entreprises</span><strong id="stat-entreprises">—</strong></div>
      <div class="stat-box"><span>Boutiques</span><strong id="stat-magasins">—</strong></div>
    </div>

    <div id="comptes-list"></div>
  </div>

<script>
(() => {
  const tokenKey = 'samacaisse_superadmin_token';
  const loginScreen = document.getElementById('login-screen');
  const dashboardScreen = document.getElementById('dashboard-screen');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const loginButton = document.getElementById('login-button');
  const comptesList = document.getElementById('comptes-list');

  const api = async (path, options = {}) => {
    const token = localStorage.getItem(tokenKey);
    const headers = { ...(options.headers || {}) };
    if (token) headers.Authorization = `Bearer ${token}`;
    const response = await fetch(path, { ...options, headers });
    const payload = await response.json().catch(() => ({}));
    return { response, payload };
  };

  const showLogin = () => {
    localStorage.removeItem(tokenKey);
    dashboardScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
  };

  const showDashboard = () => {
    loginScreen.classList.add('hidden');
    dashboardScreen.classList.remove('hidden');
  };

  const formatDate = iso => {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  const render = data => {
    document.getElementById('stat-comptes').textContent = data.total_comptes;
    document.getElementById('stat-entreprises').textContent = data.total_entreprises;
    document.getElementById('stat-magasins').textContent = data.total_magasins;

    if (!data.comptes.length) {
      comptesList.innerHTML = '<div class="empty-state">Aucun compte inscrit pour le moment.</div>';
      return;
    }

    comptesList.innerHTML = data.comptes.map(compte => `
      <div class="compte-card" data-compte-id="${compte.id}">
        <div class="compte-top">
          <div>
            <strong>${escapeHtml(compte.nom || 'Sans nom')}</strong>
            <span>${escapeHtml(compte.email || compte.telephone || '—')} · inscrit le ${formatDate(compte.cree_le)}</span>
          </div>
          <div class="compte-actions">
            <button class="icon-btn danger" data-action="delete-compte" data-id="${compte.id}">Supprimer le compte</button>
          </div>
        </div>
        <div class="entreprise-list">
          ${compte.entreprises.length ? compte.entreprises.map(ent => `
            <div class="entreprise-row" data-entreprise-id="${ent.id}">
              <div class="info">
                <strong>${escapeHtml(ent.nom)}</strong>
                <span>${ent.nb_magasins} boutique${ent.nb_magasins > 1 ? 's' : ''} · ${escapeHtml(ent.devise)} · créée le ${formatDate(ent.cree_le)}</span>
              </div>
              <button class="icon-btn danger" data-action="delete-entreprise" data-id="${ent.id}">Supprimer</button>
            </div>
          `).join('') : '<div class="entreprise-row"><span class="info"><span>Aucune entreprise créée.</span></span></div>'}
        </div>
      </div>
    `).join('');
  };

  const escapeHtml = str => String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  const loadOverview = async () => {
    const { response, payload } = await api('/api/superadmin');
    if (!response.ok) { showLogin(); return; }
    render(payload);
  };

  loginForm.addEventListener('submit', async event => {
    event.preventDefault();
    loginError.textContent = '';
    loginButton.disabled = true;
    loginButton.textContent = 'Connexion...';
    try {
      const email = document.getElementById('sa-email').value.trim();
      const password = document.getElementById('sa-password').value;
      const { response, payload } = await api('/api/superadmin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', email, password })
      });
      if (!response.ok) { loginError.textContent = payload.error || 'Connexion impossible.'; return; }
      localStorage.setItem(tokenKey, payload.token);
      showDashboard();
      await loadOverview();
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = 'Se connecter';
    }
  });

  document.getElementById('logout-button').addEventListener('click', showLogin);

  comptesList.addEventListener('click', async event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const id = button.dataset.id;
    const isCompte = button.dataset.action === 'delete-compte';
    const message = isCompte
      ? 'Supprimer ce compte va effacer TOUTES ses entreprises, magasins, ventes et dépenses. Continuer ?'
      : 'Supprimer cette entreprise va effacer ses magasins, ventes et dépenses. Continuer ?';
    if (!window.confirm(message)) return;

    button.disabled = true;
    const { response, payload } = await api('/api/superadmin', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cible: isCompte ? 'compte' : 'entreprise', id })
    });
    if (!response.ok) { window.alert(payload.error || 'Suppression impossible.'); button.disabled = false; return; }
    await loadOverview();
  });

  const start = async () => {
    if (!localStorage.getItem(tokenKey)) { showLogin(); return; }
    showDashboard();
    await loadOverview();
  };

  start();
})();
</script>
</body>
</html>
